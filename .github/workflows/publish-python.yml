name: Publish to PyPI

# A v* tag publishes the release. abi3 wheels (one per platform, every
# CPython from requires-python up) for Linux (glibc and musl), macOS and
# Windows on x86-64 and ARM, and the sdist for anything else. Until 2.0.2
# this built one cp311 manylinux_2_34 x86-64 wheel, so pip on any other
# Python or platform found nothing it could install.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux x86-64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: manylinux aarch64, runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: musllinux x86-64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux aarch64, runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macOS arm64, runner: macos-latest, target: aarch64, manylinux: auto }
          - { name: macOS x86-64, runner: macos-latest, target: x86_64, manylinux: auto }
          - { name: Windows x64, runner: windows-latest, target: x64, manylinux: auto }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  publish-pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing (configured for this workflow)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
