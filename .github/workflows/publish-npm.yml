name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

# Trusted publishing: npm takes the workflow's OIDC identity instead of a
# token (the NPM_TOKEN this used had expired; 2.0.x went out by hand). It
# needs npm 11.5.1 or later, and the package's trusted publisher set on
# npmjs.com to this repository and publish-npm.yml. Provenance is
# attached automatically.
permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    # The OIDC identity npm publishes with, for this job only
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Build WASM package
        run: wasm-pack build --target bundler -- --features wasm

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Node 24 ships npm 11.5.1 or later, the first with trusted publishing:
      # checked, rather than installed unpinned over it
      - name: npm with trusted publishing
        run: |
          v=$(npm --version)
          printf '%s\n' 11.5.1 "$v" | sort -V -C || { echo "::error::npm $v predates trusted publishing (11.5.1)"; exit 1; }
          echo "npm $v"

      # wasm-pack writes Cargo.toml's repository as a plain https URL, which
      # npm rewrites (with a warning) to the git+https form provenance names
      - name: Repository URL in npm's form
        working-directory: ./pkg
        run: npm pkg set repository.type=git repository.url=git+https://github.com/PQCrypta/pqc-binary-format.git

      - name: Publish to npm
        working-directory: ./pkg
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "pqc-binary-format@$version" version > /dev/null 2>&1; then
            echo "pqc-binary-format $version is already published"
          else
            npm publish --access public
          fi

      - name: Verify publication
        run: |
          sleep 10
          npm view pqc-binary-format version
