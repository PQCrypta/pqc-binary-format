name: Publish to crates.io

# A v* tag publishes the release, as it does to PyPI, npm and the Go proxy
# (PUBLISHING.md). This ran on a GitHub release, which releases are not made
# as, and crates.io had no trusted publisher for it: it failed on the one
# release it saw, and 2.0.x was published by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag and every manifest name one version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          python=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          js=$(jq -r .version bindings/javascript/package.json)
          echo "tag $tag, Cargo.toml $cargo, pyproject.toml $python, bindings/javascript $js"
          [ "$tag" = "$cargo" ] && [ "$tag" = "$python" ] && [ "$tag" = "$js" ] || {
            echo "::error::the tag and the manifests disagree on the version"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: |
          cargo test --all --verbose
          cargo test --doc --verbose

      - name: Run examples
        run: |
          cargo run --example basic_usage
          cargo run --example with_compression
          cargo run --example algorithm_comparison

      - name: Verify package
        run: cargo package --allow-dirty --verbose

      - name: Already on crates.io?
        id: existing
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -fsS -A "pqc-binary-format release (contact@pqcrypta.com)" \
               "https://crates.io/api/v1/crates/pqc-binary-format/$version" > /dev/null; then
            echo "pqc-binary-format $version is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get OIDC token from crates.io
        if: steps.existing.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish to crates.io (trusted publishing)
        if: steps.existing.outputs.published != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Verify publication
        run: |
          sleep 30
          PACKAGE_NAME=$(grep '^name' Cargo.toml | head -1 | cut -d'"' -f2)
          PACKAGE_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Checking if $PACKAGE_NAME v$PACKAGE_VERSION is available..."
          cargo search $PACKAGE_NAME | grep -q $PACKAGE_VERSION && echo "✅ Package published successfully!" || echo "⚠️ Package not yet indexed (may take a few minutes)"
