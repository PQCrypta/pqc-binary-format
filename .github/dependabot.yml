version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      # init, autobuild, analyze and upload-sarif must run the same release:
      # CodeQL refuses a configuration written by another one.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # .github/requirements-maturin.txt, pinned by hash: Dependabot moves the
  # version and its hashes together
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"

  # The fuzz targets' crate (its own workspace) and the ClusterFuzzLite
  # builder image, pinned by digest
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
